<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="assets/3d/crest.svg" type="image/svg+xml"><meta name="theme-color" content="#0b1417"><meta name="application-version" content="1.1"><title>ELDERFALL · 유적의 결투</title><meta name="description" content="3D 유적에서 이동하고 검으로 수호병을 공격하는 엘더폴의 첫 장면."><link rel="stylesheet" href="arena.css?v=1.1"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head>
<body><main id="arena"><canvas id="scene" aria-label="3D 유적: 바닥을 눌러 이동, 수호병을 눌러 공격"></canvas><div class="frame"></div>
<header><div><span class="eyebrow">ELDERFALL / CHAPTER ZERO</span><h1>유적의 결투</h1><p>꺼지지 않은 맹세가 검을 들었다.</p></div><div class="camera-controls"><button id="camera-left" aria-label="카메라 왼쪽 회전">↶</button><button id="camera-right" aria-label="카메라 오른쪽 회전">↷</button><button id="camera-home" aria-label="캐릭터에 시점 맞추기">⌖</button><button id="sound" aria-label="소리 끄기" aria-pressed="false">♪</button></div></header>
<div id="enemy-label" class="world-label" hidden><small>무덤 수호병</small><div class="health enemy"><i id="enemy-health"></i></div><span id="enemy-hp"></span></div>
<div id="floaters"></div>
<section class="hud" id="hud" hidden><div class="hero-status"><span class="crest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l6-6m-7 4l3 3m2-10l5 5m-3-2L21 3h-4L8 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><span class="eyebrow">THE WANDERING KNIGHT</span><h2>아렌 <small>방랑 기사</small></h2><div class="health"><i id="hero-health"></i></div><small id="hero-hp"></small></div></div><div class="command"><span id="phase">당신의 차례</span><p id="hint">바닥을 눌러 이동하세요.</p><button id="attack"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l6-6m-7 4l3 3m2-10l5 5m-3-2L21 3h-4L8 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span> 수호병에게 접근해 공격</button></div><button id="reset" class="reset" aria-label="장면 다시 시작">↺ <span>다시 시작</span></button></section>
<div class="controls-note" id="controls-note" hidden>바닥 탭 · 이동 <b>◆</b> 적 탭 · 공격 <b>◆</b> 드래그 · 시점 회전 <b>◆</b> 두 손가락 · 확대</div>
<section id="loading" class="loading"><span class="eyebrow">ELDERFALL</span><h2>검이 닿는 거리</h2><p id="load-copy">유적을 불러오는 중…</p><div class="load-track"><i id="load-progress"></i></div><button id="enter" hidden>유적으로 들어가기 <span>→</span></button><small>이동과 공격을 플레이하는 첫 3D 장면</small></section>
<dialog id="reset-dialog"><h2>결투를 다시 시작할까요?</h2><p>기사와 수호병이 처음 위치로 돌아갑니다.</p><div><button id="reset-cancel">계속하기</button><button id="reset-confirm">다시 시작</button></div></dialog>
<div id="notice" role="status" aria-live="polite" hidden></div><div id="impact-flash"></div>
</main><script type="module" src="arena.js?v=1.1"></script></body></html>
