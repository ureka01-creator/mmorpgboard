<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1016"><meta name="application-version" content="2.1"><title>ELDERFALL · 잊힌 성역</title><meta name="description" content="높은 시점의 3D 던전에서 직접 이동하고 검을 휘두르는 실시간 액션 RPG."><link rel="icon" href="assets/3d/crest.svg"><link rel="stylesheet" href="arena.css?v=2.1"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head>
<body><main id="arena"><canvas id="scene" aria-label="3D 던전. 바닥을 눌러 이동하거나 이동 패드를 사용하세요."></canvas><div class="frame"></div>
<header id="hud" hidden><div class="hero-status"><div class="portrait"><img id="hero-portrait" alt="방랑 기사 아렌"></div><div><span class="eyebrow">AREN · 아렌</span><div class="health"><i id="hero-health"></i></div><small id="hero-hp">40 / 40</small></div></div><div class="title"><span class="eyebrow">ELDERFALL</span><h1>잊힌 성역</h1></div><nav><button id="sound" aria-label="소리 끄기" aria-pressed="false">♪</button><button id="pause" aria-label="일시 정지">Ⅱ</button><button id="reset" aria-label="다시 시작">↺</button></nav></header>
<div id="enemy-label" class="world-label" hidden><span>성역의 수호병</span><div class="health enemy"><i id="enemy-health"></i></div><small id="enemy-hp"></small></div>
<div id="floaters"></div><div id="notice" role="status" aria-live="polite" hidden></div><div id="impact-flash"></div>
<section id="controls" hidden aria-label="게임 조작"><div class="move-controls"><div id="joystick" role="group" aria-label="이동 패드"><div class="joystick-ring"></div><div class="joystick-cross"></div><span id="joystick-thumb"></span></div><span class="control-caption">이동 <small>W A S D</small></span></div><div class="action-controls"><div><button id="attack" class="action" aria-label="검 공격"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 39l10-10m-14 6l8 8m2-20l10 10m-6-4L41 7h-7L15 23"/></svg><span id="attack-cooldown"></span></button><span class="control-caption">검격 <small>SPACE</small></span></div><div><button id="dodge" class="action secondary" aria-label="회피"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="29" cy="10" r="4"/><path d="M13 20l9-5 9 7 8-2M22 15l-4 13 12 4 4 9M18 28L9 39M4 18h9M2 25h8"/></svg><span id="dodge-cooldown"></span></button><span class="control-caption">회피 <small>SHIFT</small></span></div></div><p class="hint" id="hint">바닥 탭으로 이동 · 적의 준비 동작을 보고 거리를 벌리세요</p></section>
<section id="loading" class="loading"><span class="eyebrow">ELDERFALL / FIRST DESCENT</span><h2>잊힌 성역</h2><p id="load-copy">성역의 문을 여는 중…</p><div class="rule"></div><button id="enter" hidden>성역으로 들어가기 <span>→</span></button><small>직접 이동하고, 검을 휘두르고, 공격을 피하세요.</small></section>
<section id="paused" class="overlay" hidden><span class="eyebrow">ELDERFALL</span><h2>잠시 숨 고르기</h2><p>성역의 시간이 멈췄습니다.</p><button id="resume">계속하기</button></section>
<section id="result" class="result" hidden><span class="eyebrow" id="result-caption"></span><h2 id="result-title"></h2><p id="result-copy"></p><button id="again">다시 도전</button></section>
<dialog id="reset-dialog"><h2>다시 시작할까요?</h2><p>기사와 수호병이 처음 상태로 돌아갑니다.</p><div><button id="reset-cancel">계속하기</button><button id="reset-confirm">다시 시작</button></div></dialog>
</main><script type="module" src="arena.js?v=2.1"></script></body></html>
