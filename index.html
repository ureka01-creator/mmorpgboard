<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111916"><meta name="application-version" content="1.0"><meta name="description" content="엘더폴: 잊힌 맹세. 동료를 모으고 대화와 전술로 모험을 완성하는 작은 파티 RPG."><title>ELDERFALL · 잊힌 맹세</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main id="game" hidden>
 <div class="backdrop" id="backdrop"></div><div class="vignette"></div>
 <header class="topbar"><div><span class="eyebrow" id="scene-type">ELDERFALL</span><h1 id="location"></h1></div><button id="journal-button" aria-label="모험 일지 열기">모험 일지 <span>☷</span></button></header>
 <aside class="quest"><span class="quest-mark">◇</span><div><small>잊힌 맹세</small><p id="goal"></p></div></aside>
 <section id="map" aria-label="탐험 지도"></section>
 <div id="context" class="context" hidden></div>
 <section class="dice-result" id="dice-result" hidden aria-live="polite"></section>
 <footer class="dock"><div class="dock-heading"><span id="phase"></span><span id="resources"></span></div><div class="dock-content"><div id="party" class="party" aria-label="파티 영웅"></div><div class="actions"><p id="action-hint"></p><div id="actions"></div></div></div><div class="last-log" id="last-log"></div></footer>
 <section id="dialogue" class="dialogue" hidden aria-label="인물 대화"></section>
</main>
<section id="welcome" class="welcome"><div class="welcome-art"></div><div class="welcome-copy"><span class="eyebrow">A PARTY ROLE-PLAYING ADVENTURE</span><h1>ELDERFALL</h1><h2>잊힌 맹세</h2><p>돌아오지 않는 빛. 숲에 남겨진 오래된 약속.<br>검과 마법만으로는 모든 길을 열 수 없다.</p><div class="intro-features"><span>01 <b>대화와 선택</b></span><span>02 <b>세 명의 동료</b></span><span>03 <b>위치와 전술</b></span></div><button id="start" class="primary">모험 시작 <span>→</span></button><button id="continue" hidden>저장된 모험 이어하기</button><small>짧은 첫 번째 모험 · 자동 저장 · 터치 지원</small><p class="save-notice" id="save-notice"></p></div></section>
<dialog id="journal"><div class="modal-header"><div><span class="eyebrow">ADVENTURE JOURNAL</span><h2>모험 일지</h2></div><button id="journal-close" aria-label="일지 닫기">×</button></div><div id="journal-content"></div><button id="restart" class="danger">새 모험 시작</button></dialog>
<dialog id="restart-confirm"><h2>새 모험을 시작할까요?</h2><p>현재 모험의 자동 저장이 새 모험으로 교체됩니다.</p><div class="modal-buttons"><button id="restart-cancel">계속 모험하기</button><button id="restart-confirm-button" class="primary">새 모험 시작</button></div></dialog>
<dialog id="ending"><span class="eyebrow">ELDERFALL · CHAPTER I</span><h2 id="ending-title"></h2><p id="ending-copy"></p><button id="ending-journal">모험 기록 보기</button><button id="ending-restart" class="primary">다른 선택으로 다시 시작</button></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="rpg-engine.js"></script><script src="app.js"></script></body></html>
